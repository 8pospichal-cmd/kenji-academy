# SUPABASE_URL je veřejná adresa (patří do klientského kódu, chrání ji RLS) —
# není to únik tajemství, tak ji vyjmi z Netlify secret scanu, ať build neselže.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# Pretty URLs — odstraní .html z adresního řádku
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/academy"
  to = "/academy.html"
  status = 200

[[redirects]]
  from = "/platba-uspesna"
  to = "/platba-uspesna.html"
  status = 200

[[redirects]]
  from = "/platba-zrusena"
  to = "/platba-zrusena.html"
  status = 200

[[redirects]]
  from = "/clanky/:slug"
  to = "/clanky/:slug.html"
  status = 200

[[redirects]]
  from = "/certifikat"
  to = "/odmena"
  status = 301

[[redirects]]
  from = "/certifikat.html"
  to = "/odmena.html"
  status = 301

# Stará ceníková stránka /pristup je zrušená (nahradil ji nákupní modal) —
# případné staré odkazy pošli natrvalo na prodejní stránku místo 404.
[[redirects]]
  from = "/pristup"
  to = "/academy.html"
  status = 301

[[redirects]]
  from = "/pristup.html"
  to = "/academy.html"
  status = 301

# Favicon — prohlížeč si /favicon.ico žádá automaticky; servíruj SVG (jinak 404).
[[redirects]]
  from = "/favicon.ico"
  to = "/assets/favicon.svg"
  status = 200

# Netlify publikuje celý kořen repa, takže bez těchto pravidel jsou veřejně čitelné
# i SQL migrace, interní dokumentace a node_modules. force = true je nutné —
# jinak by se statický soubor doručil dřív, než se pravidlo uplatní.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_source/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_originals/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/kenji-deploy/*"
  to = "/404.html"
  status = 404
  force = true

# Interní poznámky v Markdownu (CONTEXT.md, STAV_PROJEKTU.md, návody k nastavení).
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Sdílené CSS a JS mají jednotný ?v= parametr v HTML, takže se napříč stránkami
# stáhnou jen jednou. Týdenní browser cache zároveň bezpečně pokryje obrázky,
# které nemají vždy verzi v URL; nový deploy zůstává na CDN okamžitě aktuální.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
