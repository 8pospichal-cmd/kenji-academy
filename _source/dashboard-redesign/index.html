<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — A vs. B</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #050505; color: #f5f5f5; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
.bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 20px; background: rgba(5,5,5,.9); backdrop-filter: blur(10px); border-bottom: 1px solid #1c1c1c; }
.bar h1 { font-size: 15px; font-weight: 900; letter-spacing: -.02em; }
.seg { display: flex; background: #151515; border-radius: 99px; padding: 4px; }
.seg button { font: 700 13px 'Inter'; color: #888; background: none; border: 0; padding: 8px 14px; border-radius: 99px; cursor: pointer; }
.seg button.on { background: #fff; color: #000; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 20px 30px; }
.col h2 { font-size: 13px; font-weight: 700; color: #999; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
.col h2 b { color: #fff; font-size: 15px; }
.col h2 a { margin-left: auto; color: #999; font-weight: 500; }
.frame { border: 1px solid #1f1f1f; border-radius: 18px; overflow: hidden; background: #0a0a0a; height: calc(100vh - 120px); display: flex; justify-content: center; }
iframe { border: 0; width: 100%; height: 100%; transition: width .3s; }
body.mobile iframe { width: 390px; border-left: 1px solid #1f1f1f; border-right: 1px solid #1f1f1f; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar">
  <h1>Kenji dashboard · dva koncepty</h1>
  <div class="seg"><button class="on" data-m="desk">Počítač</button><button data-m="mobile">Mobil</button></div>
</div>
<div class="cols">
  <div class="col"><h2><b>A · Hledáček</b> displej foťáku, spoušť = hotovo<a href="a-hledacek.html" target="_blank">Otevřít ↗</a></h2><div class="frame"><iframe src="a-hledacek.html" title="Koncept A"></iframe></div></div>
  <div class="col"><h2><b>B · Kouč</b> bento, zlatá, Kenji ukazuje na úkol<a href="b-kouc.html" target="_blank">Otevřít ↗</a></h2><div class="frame"><iframe src="b-kouc.html" title="Koncept B"></iframe></div></div>
</div>
<script>
document.querySelectorAll('.seg button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
    document.body.classList.toggle('mobile', b.getAttribute('data-m') === 'mobile');
  });
});
</script>
</body>
</html>
