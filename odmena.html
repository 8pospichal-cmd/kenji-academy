    <div class="main-inner">
      <div class="breadcrumbs no-print">

        <a href="kviz.html">Kvíz</a>

<script src="assets/articles.js?v=20260824-value-v1"></script>

<script>
// ============================================
// KENJI KVÍZ — ODMĚNA
// ============================================
(function () {
  const QUIZ = window.KENJI_QUIZ;
  const app = document.getElementById('reward-app');
  if (!QUIZ || !app) return;
  const KEY = 'kenji_quiz_v1';
  const REWARD_PDF = 'assets/90VYZVA-LISTY.pdf';

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function state() { const s = load(); s.passed = s.passed || []; s.best = s.best || {}; return s; }
  const allPassed = () => QUIZ.levels.every((l) => (state().passed || []).includes(l.id));

  // ---------- není hotovo ----------
  if (!allPassed()) {
    const done = QUIZ.levels.filter((l) => (state().passed || []).includes(l.id)).length;
    app.innerHTML = `
      <div class="reward-locked">
        <div class="cl-icon">🔒</div>
        <h1>Tajná odměna zatím zamčená</h1>
        <p>Abys odemkl pracovní listy k 90denní výzvě, musíš zvládnout <strong>všechny čtyři levely</strong> kvízu.
        Zatím máš hotovo <strong>${done}/${QUIZ.levels.length}</strong>.</p>
        <a class="ql-btn" href="kviz.html">← Zpět ke kvízu</a>
      </div>`;
    return;
  }

  // ---------- hotovo: odměna ----------
  app.innerHTML = `
    <section class="reward-hero">
      <div class="reward-kicker">ODMĚNA ODEMČENÁ</div>
      <h1>Pracovní listy k <span>90denní výzvě</span></h1>
      <p>Zvládl jsi všechny čtyři levely. Tohle není diplom do šuplíku. Tohle je praktický PDF workbook, který tě provede budováním podnikání, cash flow a získáváním nových klientů krok za krokem.</p>
      <div class="reward-actions">
        <a class="ql-btn reward-primary" href="${REWARD_PDF}" download>Stáhnout pracovní listy →</a>
        <a class="ql-btn ghost" href="kviz.html">← Zpět ke kvízu</a>
      </div>
    </section>

    <div class="reward-grid">
      <div class="reward-card">
        <div class="reward-card-icon">📄</div>
        <h2>Co dostaneš</h2>
        <p>PDF pracovní listy k 90denní výzvě. Místo teorie konkrétní kroky, které tě donutí řešit nabídku, prodej, cash flow a akvizici.</p>
      </div>
      <div class="reward-card">
        <div class="reward-card-icon">💸</div>
        <h2>Proč to má hodnotu</h2>
        <p>Je to postup, který tě vede k rychlejšímu vybudování funkčního podnikání: víc klientů, lepší systém a jasnější plán na další týdny.</p>
      </div>
      <div class="reward-card">
        <div class="reward-card-icon">🔥</div>
        <h2>Jak to použít</h2>
        <p>Neproklikej to. Vytiskni si to nebo si to otevři v tabletu a vyplňuj. Výsledek bude tak dobrý, jak poctivě do toho půjdeš.</p>
      </div>
    </div>

    <div class="reward-academy">
      <div>
        <div class="reward-academy-kicker">CHCEŠ CELÝ SYSTÉM?</div>
        <h2>90denní výzva je nejsilnější, když ji projdeš s vedením.</h2>
        <p>V Kenji Academy máš k tomu komunitu, videa, webináře a podporu. Pracovní listy jsou start. Academy je prostředí, kde to dotáhneš.</p>
      </div>
      <a class="ql-btn" href="academy.html">Zjistit více →</a>
    </div>`;
})();
</script>
<script src="assets/script.js?v=20260824-ai-retry-v1"></script>
</body>
