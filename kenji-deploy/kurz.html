<!DOCTYPE html>
<html lang="cs">
<head>
<script>(function(){try{if(localStorage.getItem("kenji_theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurz — Kenji Academy | Kenji Knihovna</title>
<meta name="description" content="Detail videokurzu Kenji Academy — moduly, lekce a videa. Pro členy.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=20260826-gate-v1">
</head>
<body>

<header class="top-header">
  <button class="menu-toggle" aria-label="Otevřít menu">☰</button>
  <a href="index.html" class="brand"><div class="brand-name">KENJI ACADEMY</div></a>
  <div class="header-spacer"></div>
  <div class="header-actions"><span class="header-tag">EXCLUSIVE • MEMBERS ONLY</span></div>
</header>

<div class="sidebar-overlay"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="main-inner" id="course-root">
      <!-- generuje se JS -->
    </div>
  </main>
</div>

<script src="assets/articles.js?v=20260822-guided"></script>
<script src="assets/courses.js?v=20260602-kurztree"></script>
<script src="assets/course-content.js?v=20260602-kurztree"></script>
<script src="assets/nav.js?v=20260822-guided"></script>
<script src="assets/auth.js?v=20260826-tier-v1"></script>
<script src="assets/script.js"></script>

<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function normTitle(s){ return String(s==null?'':s).replace(/^\s*\d+\.\s*/,'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,''); }
  var member = false; try { member = !!(window.KenjiAuth && window.KenjiAuth.isMember()); } catch(e){}
  var slug = (new URLSearchParams(location.search)).get('slug');
  var c = window.kenjiCourseBySlug ? window.kenjiCourseBySlug(slug) : null;
  // obsah lekcí (videa + popisky) z generovaného souboru; merge s manifestem
  var CC = (window.KENJI_COURSE_CONTENT || {})[slug] || {};
  function lessonData(l){ var e = CC[normTitle(l.title)] || {}; return { youtube: e.youtube || l.youtube || '', content: e.content || l.content || '' }; }
  var root = document.getElementById('course-root');

  if (!c) {
    root.innerHTML = '<div class="breadcrumbs"><a href="kurzy.html">Kurzy</a></div>'+
      '<div class="paywall"><div class="paywall-lock">🤷</div><h2 class="paywall-title">Kurz nenalezen</h2>'+
      '<p class="paywall-text">Tenhle kurz neexistuje. Vrať se na <a href="kurzy.html">přehled kurzů</a>.</p></div>';
    return;
  }

  var lessons = window.kenjiCourseLessonCount(c), mods = (c.modules||[]).length;
  var PKEY = 'kenji_course_'+c.slug;
  var done = {}; try { done = JSON.parse(localStorage.getItem(PKEY)) || {}; } catch(e){}
  function saveDone(){ try { localStorage.setItem(PKEY, JSON.stringify(done)); } catch(e){} if (window.KenjiProgress && window.KenjiProgress.push) window.KenjiProgress.push(); }
  function doneCount(){ return Object.keys(done).filter(function(k){return done[k];}).length; }
  function pct(){ return lessons ? Math.round(doneCount()/lessons*100) : 0; }

  // ---------- HLAVNÍ OBSAH (breadcrumb + hero + přehrávač / paywall) ----------
  var html = '';
  html += '<div class="breadcrumbs"><a href="kurzy.html">Kurzy</a><span class="separator">/</span><span class="current">'+esc(c.title)+'</span></div>';
  html += '<section class="course-hero">'+
    '<div class="course-eyebrow">Kenji Academy · Kurz</div>'+
    '<h1 class="course-hero-title">'+esc(c.title)+'</h1>'+
    '<p class="course-hero-desc">'+esc(c.desc)+'</p>'+
    '<div class="course-hero-meta"><span id="progress-label">Dokončeno '+doneCount()+'/'+lessons+' lekcí</span> · '+mods+' '+(mods===1?'modul':(mods<5?'moduly':'modulů'))+'</div>'+
  '</section>';

  if (member) {
    html += '<div class="player-wrap" id="player">'+
      '<div class="player-box"><div class="player-empty"><span class="pe-ico">▶</span><span>Vyber lekci vlevo a spustí se tady.</span></div></div>'+
      '<div class="player-title" id="player-title"></div>'+
      '<div class="player-note" id="player-note"></div>'+
      '<div class="lesson-nav" id="lesson-nav"></div>'+
    '</div>';
  } else {
    html += '<div class="paywall">'+
      '<div class="paywall-lock">🔒</div>'+
      '<h2 class="paywall-title">Kurzy jsou pro členy</h2>'+
      '<p class="paywall-text">Tohle je kompletní videokurz Kenji Academy. Vlevo vidíš celou osnovu — videa se odemknou členům plného přístupu.</p>'+
      '<div class="paywall-actions">'+
        '<a class="paywall-cta" href="academy.html">Chci do Kenji Academy</a>'+
        '<span class="paywall-note">Kompletní program + komunita · nebo jen <a href="#" data-checkout-product="databaze">databáze 1 497 Kč</a></span>'+
      '</div>'+
    '</div>';
  }
  root.innerHTML = html;

  // ---------- STROM LEKCÍ DO LIŠTY (#course-tree) ----------
  var treeMount = document.getElementById('course-tree');
  if (treeMount) {
    var t = '';
    t += '<div class="ct-prog"><div class="ct-prog-bar"><span id="ct-prog-fill" style="width:'+pct()+'%"></span></div><span class="ct-prog-pct" id="ct-prog-pct">'+pct()+' %</span></div>';
    var gi = 0, flat = [];
    (c.modules||[]).forEach(function(m, mi){
      t += '<div class="ct-mod'+(mi===0?' open':'')+'">'+
        '<button class="ct-mod-head" type="button"><span class="ct-mod-title">'+esc(m.title)+'</span><span class="ct-mod-count">'+m.lessons.length+'</span><span class="ct-mod-arrow">▾</span></button>'+
        '<div class="ct-mod-list">';
      m.lessons.forEach(function(l){
        var id = gi++; flat[id] = l;
        var d = lessonData(l);
        t += '<div class="ct-lesson'+(member?'':' locked')+(done[id]?' done':'')+'" data-id="'+id+'" data-yt="'+esc(d.youtube)+'" data-title="'+esc(l.title)+'">'+
          '<span class="ct-check" data-check="'+id+'" title="Označit jako hotové"></span>'+
          '<span class="ct-play">'+(member?'▶':'🔒')+'</span>'+
          '<span class="ct-lesson-title">'+esc(l.title)+'</span>'+
          (d.youtube?'':'<span class="ct-soon">brzy</span>')+
        '</div>';
      });
      t += '</div></div>';
    });
    treeMount.innerHTML = t;

    // accordion modulů
    treeMount.querySelectorAll('.ct-mod-head').forEach(function(btn){
      btn.addEventListener('click', function(){ btn.closest('.ct-mod').classList.toggle('open'); });
    });

    function refreshProgress(){
      var p = pct();
      document.getElementById('progress-label').textContent = 'Dokončeno '+doneCount()+'/'+lessons+' lekcí';
      var f = document.getElementById('ct-prog-fill'); if (f) f.style.width = p+'%';
      var pc = document.getElementById('ct-prog-pct'); if (pc) pc.textContent = p+' %';
    }
    function closeDrawer(){
      var sb = document.getElementById('sidebar'); if (sb) sb.classList.remove('open');
      var ov = document.querySelector('.sidebar-overlay'); if (ov) ov.classList.remove('show');
      document.body.classList.remove('sidebar-open');
    }

    if (member) {
      var currentId = -1;
      function playLesson(id){
        var row = treeMount.querySelector('.ct-lesson[data-id="'+id+'"]');
        if (!row) return;
        var l = flat[id] || {};
        var d = lessonData(l);
        var title = l.title || row.getAttribute('data-title');
        var box = document.querySelector('.player-box');
        document.getElementById('player-title').textContent = title;
        var note = document.getElementById('player-note');
        if (note) note.innerHTML = d.content ? '<div class="lesson-content">'+d.content+'</div>' : '';
        treeMount.querySelectorAll('.ct-lesson.playing').forEach(function(r){ r.classList.remove('playing'); });
        row.classList.add('playing');
        var mod = row.closest('.ct-mod'); if (mod) mod.classList.add('open');
        if (d.youtube) {
          box.innerHTML = '<div class="player-embed"><iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(d.youtube)+'" title="'+esc(title)+'" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
        } else {
          box.innerHTML = '<div class="player-empty"><span class="pe-ico">🎬</span><span>Video k lekci „'+esc(title)+'" se připravuje — brzy doplníme.</span></div>';
        }
        currentId = id;
        updateNav();
        closeDrawer();
        document.getElementById('player').scrollIntoView({behavior:'smooth', block:'start'});
      }
      function updateNav(){
        var nav = document.getElementById('lesson-nav'); if (!nav) return;
        var total = lessons;
        var prevH = currentId > 0
          ? '<button class="lnav lnav-prev" data-go="'+(currentId-1)+'"><span class="lnav-arr">←</span><span class="lnav-txt"><span class="lnav-cap">Předchozí lekce</span><span class="lnav-name">'+esc(flat[currentId-1] ? flat[currentId-1].title : '')+'</span></span></button>'
          : '<span></span>';
        var nextH;
        if (currentId < 0) {
          nextH = '<button class="lnav lnav-next" data-go="0"><span class="lnav-txt"><span class="lnav-cap">Začni kurz</span><span class="lnav-name">'+esc(flat[0] ? flat[0].title : 'První lekce')+'</span></span><span class="lnav-arr">→</span></button>';
        } else if (currentId < total - 1) {
          nextH = '<button class="lnav lnav-next" data-go="'+(currentId+1)+'"><span class="lnav-txt"><span class="lnav-cap">Další lekce</span><span class="lnav-name">'+esc(flat[currentId+1] ? flat[currentId+1].title : '')+'</span></span><span class="lnav-arr">→</span></button>';
        } else {
          nextH = '<span class="lnav-end">Poslední lekce ✓</span>';
        }
        nav.innerHTML = prevH + nextH;
        nav.querySelectorAll('button[data-go]').forEach(function(b){ b.addEventListener('click', function(){ playLesson(+b.getAttribute('data-go')); }); });
      }
      treeMount.querySelectorAll('.ct-lesson').forEach(function(row){
        row.addEventListener('click', function(e){
          if (e.target.closest('.ct-check')) return;
          playLesson(+row.getAttribute('data-id'));
        });
      });
      updateNav();
      treeMount.querySelectorAll('.ct-check').forEach(function(ch){
        ch.addEventListener('click', function(e){
          e.stopPropagation();
          var id = ch.getAttribute('data-check');
          done[id] = !done[id]; saveDone();
          ch.closest('.ct-lesson').classList.toggle('done', !!done[id]);
          refreshProgress();
        });
      });
    } else {
      treeMount.querySelectorAll('.ct-lesson').forEach(function(row){
        row.addEventListener('click', function(){ closeDrawer(); var pw = document.querySelector('.paywall'); if (pw) pw.scrollIntoView({behavior:'smooth', block:'center'}); });
      });
    }
  }
})();
</script>
</body>
</html>
